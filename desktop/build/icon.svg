<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2330"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8835a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- ground line -->
  <rect x="88" y="404" width="336" height="14" rx="7" fill="#2d3342"/>
  <!-- low wing -->
  <rect x="300" y="236" width="112" height="172" rx="10" fill="#3a4152"/>
  <!-- main tower -->
  <rect x="110" y="104" width="204" height="304" rx="14" fill="url(#tower)"/>
  <!-- lit windows: 3 columns x 5 rows -->
  <g fill="#fff4e6">
    <rect x="138" y="136" width="36" height="30" rx="5"/>
    <rect x="194" y="136" width="36" height="30" rx="5" opacity=".45"/>
    <rect x="250" y="136" width="36" height="30" rx="5"/>
    <rect x="138" y="186" width="36" height="30" rx="5" opacity=".45"/>
    <rect x="194" y="186" width="36" height="30" rx="5"/>
    <rect x="250" y="186" width="36" height="30" rx="5"/>
    <rect x="138" y="236" width="36" height="30" rx="5"/>
    <rect x="194" y="236" width="36" height="30" rx="5"/>
    <rect x="250" y="236" width="36" height="30" rx="5" opacity=".45"/>
    <rect x="138" y="286" width="36" height="30" rx="5"/>
    <rect x="194" y="286" width="36" height="30" rx="5" opacity=".45"/>
    <rect x="250" y="286" width="36" height="30" rx="5"/>
  </g>
  <!-- door -->
  <rect x="190" y="342" width="44" height="66" rx="6" fill="#7c2d12"/>
  <!-- wing windows -->
  <g fill="#9aa4b8">
    <rect x="320" y="262" width="30" height="24" rx="4"/>
    <rect x="362" y="262" width="30" height="24" rx="4"/>
    <rect x="320" y="304" width="30" height="24" rx="4"/>
    <rect x="362" y="304" width="30" height="24" rx="4" opacity=".5"/>
  </g>
</svg>
